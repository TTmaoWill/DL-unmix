[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DL-unmix"
version = "0.2.0"
description = "Reference-supervised donor-level cell-type-specific expression prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "torch>=2.5,<3"]
license = {file = "LICENSE"}

[project.urls]
Repository = "https://github.com/TTmaoWill/DL-unmix"

[project.scripts]
dlunmix = "dlunmix.cli:main"

[tool.setuptools]
packages = ["dlunmix"]
license-files = ["LICENSE", "LICENSE_SCOPE.md"]
